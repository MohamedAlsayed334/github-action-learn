name: learn-actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  example:
    runs-on: ubuntu-latest

    steps:
      - name: print hello world
        run: echo "Hello World"

      - name: checkout
        uses: actions/checkout@v7

      - name: list files
        run: ls -la
